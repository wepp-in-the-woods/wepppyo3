services:
  rq-worker:
    image: ${TOTALWATSED_PUBLISHED_IMAGE:?published immutable image required}
    mem_limit: 12g
    memswap_limit: 12g
    cpuset: "0-11"
    environment:
      WEPPPY_NCPU: "12"
      PROFILE_PLAYBACK_RUN_ROOT: /workdir/wepppyo3/target/totalwatsed3-evidence/rq-runs
      PYTHONPATH: /workdir/wepppyo3/target/totalwatsed3-evidence:/workdir/wepppy:/workdir/wepppyo3/release/linux/py312
    volumes: !override
      - /workdir/wepppyo3/target/totalwatsed3-evidence/published-image:/workdir/wepppyo3/target/totalwatsed3-evidence
      - /workdir/wepppyo3/target/totalwatsed3-evidence/scales:/workdir/wepppyo3/target/totalwatsed3-evidence/scales:ro
      - /wc1:/wc1
      - /wc1/geodata:/geodata:ro

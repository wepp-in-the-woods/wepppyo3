[package]
name = "sbs_map_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
gdal = { version = "0.16", features = ["bindgen"] }
gdal-sys = "0.9"
numpy = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ordered-float = "4"

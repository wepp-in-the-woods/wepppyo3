[package]
name = "cli_revision_rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py37"] }
numpy = "0.22"
geneva_core = { path = "../geneva_core" }

[dev-dependencies]
serde_json = "1"

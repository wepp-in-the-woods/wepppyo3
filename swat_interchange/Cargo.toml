[package]
name = "swat_interchange_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
arrow-array = "53.4.1"
arrow-schema = "53.4.1"
parquet = "53.4.1"
fast-float = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
